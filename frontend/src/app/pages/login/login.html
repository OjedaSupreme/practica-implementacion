<main class="login">
  <form class="tarjeta" (ngSubmit)="entrar()" autocomplete="on">
    <h1>Sistema de tareas</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <label>
      Usuario
      <input name="username" [(ngModel)]="username" autocomplete="username" required />
    </label>

    <label>
      Contraseña
      <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" required />
    </label>

    @if (error()) {
      <p class="error" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Validando…' : 'Iniciar sesión' }}
    </button>
  </form>
</main>
