spring.application.name=sistema-tareas
# Render (y otros hosts de contenedores) asignan el puerto con la variable PORT.
server.port=${PORT:8080}

# --- Base de datos de desarrollo: H2 en memoria ---
# En producción el perfil "prod" (application-prod.properties) la reemplaza por PostgreSQL.
spring.datasource.url=jdbc:h2:mem:tareasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Seguridad JWT ---
# Clave HMAC en Base64 (mínimo 256 bits). En producción se define con la variable de entorno JWT_SECRET.
jwt.secreto=${JWT_SECRET:c2lzdGVtYS10YXJlYXMtY2xhdmUtZGUtZGVzYXJyb2xsby0yMDI2LWNhbWJpYXItZW4tcHJvZA==}
jwt.emisor=sistema-tareas
# Vida del token de acceso: 15 minutos. Vida del refresh token: 7 días.
jwt.expiracion-acceso-ms=900000
jwt.expiracion-refresh-ms=604800000
# En producción (HTTPS) debe ser true para que la cookie solo viaje cifrada.
jwt.cookie-segura=${JWT_COOKIE_SEGURA:false}

# --- Orígenes permitidos por CORS (separados por coma) ---
app.cors.origenes=${CORS_ORIGINS:http://localhost:4200}

# --- Usuarios iniciales ---
# Valores de desarrollo. En producción se definen con APP_ADMIN_PASSWORD y APP_USUARIO_PASSWORD.
app.usuarios.admin-password=${APP_ADMIN_PASSWORD:Admin123*}
app.usuarios.usuario-password=${APP_USUARIO_PASSWORD:Usuario123*}

# --- Actuator: solo el endpoint de salud, sin detalles ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
