spring.application.name=sistema-tareas
server.port=8080

spring.datasource.url=jdbc:h2:mem:tareasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Seguridad JWT ---
# Clave HMAC en Base64 (mínimo 256 bits). En producción se define con la variable de entorno JWT_SECRET.
jwt.secreto=${JWT_SECRET:c2lzdGVtYS10YXJlYXMtY2xhdmUtZGUtZGVzYXJyb2xsby0yMDI2LWNhbWJpYXItZW4tcHJvZA==}
jwt.emisor=sistema-tareas
# Vida del token de acceso: 15 minutos. Vida del refresh token: 7 días.
jwt.expiracion-acceso-ms=900000
jwt.expiracion-refresh-ms=604800000
# En producción (HTTPS) debe ser true para que la cookie solo viaje cifrada.
jwt.cookie-segura=false
