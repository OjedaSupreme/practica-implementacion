# Perfil de producción: se activa con SPRING_PROFILES_ACTIVE=prod (lo define el Dockerfile).

# --- Servidor de base de datos: PostgreSQL ---
# La URL, el usuario y la contraseña llegan por variables de entorno. Si el host entrega DATABASE_URL
# (formato postgresql://usuario:clave@host:puerto/base), docker-entrypoint.sh la convierte a estas tres.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Pool pequeño: la instancia gratuita tiene 512 MB de RAM y la base admite pocas conexiones.
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# La consola H2 no existe en producción.
spring.h2.console.enabled=false

# El sitio se publica solo por HTTPS: la cookie del refresh token lleva el atributo Secure.
jwt.cookie-segura=true
